name: Deploy hermes-web to GitHub Pages

# Builds the hermes-web dashboard and publishes it to GitHub Pages from the hermes-web branch. The
# dashboard's data plane is the real Hermes backend running IN THE BROWSER on the holospaces substrate
# (a content-addressed RISC-V guest resumed from a banked warm κ; see docs/holospaces/architecture.md).
# The vendored wasm + the warm-κ CAS (web/public/holo/) ride along as static assets. A real Chromium
# e2e gates the deploy: the wasm runtime loads + re-derives κ; the dashboard renders (not a stub, not a
# Hologram-OS frame); and — when a warm κ is published (E2E_EXPECT_HOLOGRAM=1) — the in-browser backend
# resumes and authenticates end to end. The live URL is smoke-tested after deploy.

on:
  push:
    branches: [hermes-web]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace deps (web is an npm workspace; lockfile is at the root)
        run: npm ci

      - name: Install Chromium (vitest browser mode + Playwright)
        run: npx playwright install --with-deps chromium

      - name: Unit tests — node + REAL-browser (vitest projects) — FAIL-CLOSED
        run: npm test
        working-directory: web

      - name: Build the dashboard (base=/hermes-web/, in-browser holospaces backend)
        run: HERMES_HOLO_BASE=/hermes-web/ npx vite build --outDir dist-pages --emptyOutDir
        working-directory: web

      - name: SPA fallback (client-side routing on Pages)
        run: cp web/dist-pages/index.html web/dist-pages/404.html

      - name: Browser e2e deps (Playwright + Chromium)
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Browser e2e gate (real Chromium against the built dashboard — FAIL-CLOSED)
        # The authoritative gate: the wasm substrate re-derives κ, the shell is hermes-web, and — when a
        # warm κ shipped (E2E_EXPECT_HOLOGRAM=1) — the in-browser backend RESUMES, authenticates, and
        # EVERY dashboard feature loads real data over the loopback bridge (features.spec covers all 18
        # panels; agent-capability covers the contracts). If any feature errors, the deploy is blocked.
        run: |
          if [ -f ../web/dist-pages/holo/warm/manifest.json ]; then
            echo "warm κ present — requiring the in-browser backend + all features"
            export E2E_EXPECT_HOLOGRAM=1
          else
            echo "no warm κ in this build — hologram backend tests will skip"
          fi
          npx playwright test deployment.spec.ts features.spec.ts
        working-directory: e2e

      - name: Native-exec gate (all-native dashboard + threaded gateway + chat — FAIL-CLOSED)
        # ?native=1 runs the WHOLE backend native in one Pyodide worker (no emulator): the dashboard serves
        # /api native, the threaded tui_gateway handshakes + dispatches, and a full chat turn streams the LLM
        # reply over the egress. Then the cross-origin harness proves the real-provider path — the page's own
        # fetch to a cross-origin model is CORS-blocked, yet chat works THROUGH the router extension's CORS-free
        # fetch (the established egress). If the native agent or its egress breaks, the deploy is blocked.
        run: |
          npx playwright test native-chat.spec.ts
          node verify-xorigin.mjs
        working-directory: e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-pages

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test the LIVE deployment (same e2e against the deployed URL)
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "Waiting for $URL to serve the dashboard…"
          for i in $(seq 1 36); do
            if curl -fsS "$URL" 2>/dev/null | grep -qiE "hermes|id=.root."; then
              echo "live after ${i} tries"; break
            fi
            sleep 5
          done
          if [ -f ../web/dist-pages/holo/warm/manifest.json ]; then export E2E_EXPECT_HOLOGRAM=1; fi
          E2E_BASE_URL="$URL" npx playwright test deployment.spec.ts
        working-directory: e2e

      - name: Agent capability surface against the LIVE deploy (per-endpoint probes — informational)
        # Granular probes of individual /api endpoints over the loopback bridge, run POST-deploy so they
        # never delay the deploy. NON-BLOCKING + time-capped: some endpoints (e.g. /api/status, which
        # gathers system metrics) are heavy under RISC-V emulation and can exceed the bridge's fetch
        # budget on a loaded runner. The fail-closed render gate + smoke above are the real gates.
        continue-on-error: true
        timeout-minutes: 8
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          if [ -f ../web/dist-pages/holo/warm/manifest.json ]; then export E2E_EXPECT_HOLOGRAM=1; fi
          E2E_BASE_URL="$URL" npx playwright test agent-capability.spec.ts
        working-directory: e2e

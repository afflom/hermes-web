name: Deploy hermes-web to GitHub Pages

# Builds the hermes-web dashboard and publishes it to GitHub Pages from the hermes-web branch. The
# dashboard's data plane is the real Hermes backend running IN THE BROWSER on the holospaces substrate
# (a content-addressed RISC-V guest resumed from a banked warm κ; see docs/holospaces/architecture.md).
# The vendored wasm + the warm-κ CAS (web/public/holo/) ride along as static assets. A real Chromium
# e2e gates the deploy: the wasm runtime loads + re-derives κ; the dashboard renders (not a stub, not a
# Hologram-OS frame); and — when a warm κ is published (E2E_EXPECT_HOLOGRAM=1) — the in-browser backend
# resumes and authenticates end to end. The live URL is smoke-tested after deploy.

on:
  push:
    branches: [hermes-web]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace deps (web is an npm workspace; lockfile is at the root)
        run: npm ci

      - name: Build the dashboard (base=/hermes-web/, static no-backend build)
        run: HERMES_HOLO_BASE=/hermes-web/ npx vite build --outDir dist-pages --emptyOutDir
        working-directory: web

      - name: SPA fallback (client-side routing on Pages)
        run: cp web/dist-pages/index.html web/dist-pages/404.html

      - name: Browser e2e deps (Playwright + Chromium)
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Browser e2e gate (real Chromium against the built dashboard — FAIL-CLOSED)
        # When a warm-κ manifest shipped in the build, require the in-browser backend to resume +
        # authenticate end to end (E2E_EXPECT_HOLOGRAM=1); otherwise the hologram test skips.
        run: |
          if [ -f ../web/dist-pages/holo/warm/manifest.json ]; then
            echo "warm κ present — requiring the in-browser backend"
            export E2E_EXPECT_HOLOGRAM=1
          else
            echo "no warm κ in this build — hologram backend test will skip"
          fi
          npx playwright test
        working-directory: e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-pages

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test the LIVE deployment (same e2e against the deployed URL)
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "Waiting for $URL to serve the dashboard…"
          for i in $(seq 1 36); do
            if curl -fsS "$URL" 2>/dev/null | grep -qiE "hermes|id=.root."; then
              echo "live after ${i} tries"; break
            fi
            sleep 5
          done
          if [ -f ../web/dist-pages/holo/warm/manifest.json ]; then export E2E_EXPECT_HOLOGRAM=1; fi
          E2E_BASE_URL="$URL" npx playwright test
        working-directory: e2e
